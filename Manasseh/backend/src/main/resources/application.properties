# ==============================================================================
# Subscription Management System - Backend Application Properties
# ==============================================================================

spring.application.name=subscription-management-backend
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Configuration
# Default port: 3306 (or 3307 if configured in your XAMPP my.ini)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/subscription_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
# If using XAMPP configured on port 3307, uncomment the line below:
# spring.datasource.url=jdbc:mysql://localhost:3307/subscription_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Jackson JSON Serialization (camelCase)
# ------------------------------------------------------------------------------
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.subscription=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
