# ===================================================================
# Subscription Management System - Backend Configuration
# Modules 1, 2, 3 & 4 Unified Backend
# ===================================================================

server.port=8080
spring.application.name=subscription-management-system

# -------------------------------------------------------------------
# MySQL Production / Dev Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/subscription_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open In View
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.reset-token-expiration-ms=900000

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.subscription=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
