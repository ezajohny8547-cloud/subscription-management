server.port=8080
spring.application.name=subscription-management-system-h2

spring.datasource.url=jdbc:h2:mem:subscription_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=9a3f9118d9f1c719e35c298a0c4f828a1f8b16e029486c478d123e4567890abc
app.jwt.expiration-ms=86400000
