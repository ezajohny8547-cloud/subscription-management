server:
  port: 8080

spring:
  application:
    name: subscription-auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/subscription_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

# Custom Application Settings for Module 1
app:
  jwt:
    # 256-bit cryptographically secure secret key (hex encoded)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Token expiration time in milliseconds (24 hours)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    # Reset token validity window (15 minutes)
    reset-token-expiration-ms: ${JWT_RESET_EXPIRATION_MS:900000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging configuration: never log raw tokens or passwords
logging:
  level:
    root: INFO
    com.subscription.auth: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
